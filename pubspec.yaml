name: watch_together
description: "سينما جماعية — تطبيق مشاهدة الفيديوهات الجماعية مع دردشة ومزامنة لحظية عبر Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.10.0 <4.0.0'
  flutter: '>=3.38.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  cloud_firestore: ^5.5.1

  # إدارة الحالة
  provider: ^6.1.2

  # التنقل
  go_router: ^14.6.2

  # تشغيل الوسائط والمتصفح الداخلي
  webview_flutter: ^4.13.1
  youtube_player_iframe: ^6.0.2
  video_player: ^2.9.2
  chewie: ^1.8.6

  # الواجهات
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1

  # أدوات مساعدة
  intl: ^0.20.2
  shared_preferences: ^2.3.3
  share_plus: ^10.1.4
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
