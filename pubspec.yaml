name: watch_together
description: "سينما جماعية — تطبيق مشاهدة الفيديوهات الجماعية مع دردشة ومزامنة لحظية عبر Firebase."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'
  flutter: '>=3.27.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: any

  # Firebase
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any

  # إدارة الحالة
  provider: any

  # التنقل
  go_router: any

  # تشغيل الوسائط والمتصفح الداخلي
  webview_flutter: any
  youtube_player_iframe: any
  video_player: any
  chewie: any

  # الواجهات
  google_fonts: any
  cached_network_image: any

  # أدوات مساعدة
  intl: any
  shared_preferences: any
  share_plus: any
  url_launcher: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any

flutter:
  uses-material-design: true
  assets:
    - assets/images/
