name: Build APK

on:
  workflow_dispatch:
    inputs:
      push_token:
        description: "رمز مؤقت لدفع مخرجات البناء (اختياري)"
        required: false
        type: string
  push:
    branches: [arena/**]

permissions:
  contents: write

jobs:
  build:
    name: بناء ملف APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تنصيب Flutter (أحدث إصدار مستقر)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: إظهار الإصدارات
        run: |
          flutter --version
          java -version

      - name: تجهيز مجلد السجلات
        run: mkdir -p logs

      - name: flutter pub get
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee logs/pubget.log

      - name: flutter analyze
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee logs/analyze.log

      - name: بناء APK (release — arm64 للهواتف الحديثة)
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --release --target-platform android-arm64 2>&1 | tee logs/build.log

      - name: سجلّات في ملخص التشغيل
        if: always()
        shell: bash
        run: |
          {
            echo "## analyze (آخر 80 سطرًا)"
            echo '```'
            tail -n 80 logs/analyze.log || true
            echo '```'
            echo "## build (آخر 120 سطرًا)"
            echo '```'
            tail -n 120 logs/build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: رفع APK والسجلات (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-together-apk
          if-no-files-found: ignore
          path: |
            build/app/outputs/flutter-apk/*.apk
            logs/*.log
            pubspec.lock
          retention-days: 14

      - name: نشر المخرجات إلى فرع builds/apk
        if: always()
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # تجميع المخرجات قبل الانتقال للفرع اليتيم
          mkdir -p /tmp/dist/logs /tmp/dist/parts
          cp logs/*.log /tmp/dist/logs/ 2>/dev/null || true
          [ -f pubspec.lock ] && cp pubspec.lock /tmp/dist/ || true

          APK="build/app/outputs/flutter-apk/app-release.apk"
          if [ -f "$APK" ]; then
            SIZE_MB=$(du -m "$APK" | cut -f1)
            echo "APK size: ${SIZE_MB} MB"
            if [ "$SIZE_MB" -lt 45 ]; then
              cp "$APK" /tmp/dist/sinema-jamaiya-arm64.apk
            else
              # تقسيم لأجزاء 40MB لاحترام حدّ GitHub للملفات
              split -b 40m -d -a 2 "$APK" /tmp/dist/parts/watch-together.apk.part-
              (cd /tmp/dist/parts && sha256sum watch-together.apk.part-* > SHA256SUMS)
            fi
          else
            echo "BUILD_MISSING" > /tmp/dist/BUILD_MISSING.txt
          fi

          # فرع يتيم يحتوي المخرجات فقط
          git checkout --orphan builds-apk
          git rm -rf --cached . >/dev/null 2>&1 || true
          find . -maxdepth 1 -mindepth 1 ! -name '.git' -exec rm -rf {} +
          cp -r /tmp/dist ./dist
          git add dist
          git -c commit.gpgsign=false commit -m "apk build ${{ github.run_id }}"
          git push -f origin HEAD:refs/heads/builds/apk
