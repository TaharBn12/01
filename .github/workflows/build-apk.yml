name: Build APK

on:
  workflow_dispatch:
    inputs:
      push_token:
        description: "رمز مؤقت لدفع مخرجات البناء (اختياري)"
        required: false
        type: string
  push:
    branches: [arena/**]

permissions:
  contents: write

jobs:
  build:
    name: بناء ملف APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تنصيب Flutter (أحدث إصدار مستقر)
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: إظهار الإصدارات
        run: |
          flutter --version
          java -version

      - name: تجهيز مجلد السجلات
        run: mkdir -p logs

      - name: flutter pub get
        shell: bash
        run: |
          set -o pipefail
          flutter pub get 2>&1 | tee logs/pubget.log

      - name: flutter analyze
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee logs/analyze.log

      - name: بناء APK (debug)
        id: build
        shell: bash
        continue-on-error: true
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee logs/build.log

      - name: سجلّات في ملخص التشغيل
        if: always()
        shell: bash
        run: |
          {
            echo "## analyze (آخر 80 سطرًا)"
            echo '```'
            tail -n 80 logs/analyze.log || true
            echo '```'
            echo "## build (آخر 120 سطرًا)"
            echo '```'
            tail -n 120 logs/build.log || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: رفع APK والسجلات
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: watch-together-apk
          if-no-files-found: ignore
          path: |
            build/app/outputs/flutter-apk/*.apk
            logs/*.log
            pubspec.lock
          retention-days: 14

      - name: نشر الـ APK إلى فرع builds/apk
        if: always()
        shell: bash
        env:
          PUSH_TOKEN: ${{ github.event.inputs.push_token }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          AUTH_TOKEN="${PUSH_TOKEN:-$GH_TOKEN}"
          # إخفاء الرمز من السجلات
          echo "::add-mask::${AUTH_TOKEN}"
          set -x
          rm -rf /tmp/dist && mkdir -p /tmp/dist/logs
          cp logs/*.log /tmp/dist/logs/ 2>/dev/null || true
          cp pubspec.lock /tmp/dist/ 2>/dev/null || true
          APK="$(ls build/app/outputs/flutter-apk/app-debug.apk 2>/dev/null || true)"
          if [ -n "$APK" ]; then
            cp "$APK" /tmp/dist/watch-together-debug.apk
            ls -lh /tmp/dist/watch-together-debug.apk
          else
            echo "BUILD_MISSING" > /tmp/dist/BUILD_MISSING.txt
          fi
          cd /tmp/dist
          git init -q
          git checkout -q --orphan apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git -c commit.gpgsign=false commit -q -m "apk build ${{ github.run_id }}"
          git remote add origin "https://x-access-token:${AUTH_TOKEN}@github.com/${{ github.repository }}.git"
          git push -f origin apk:refs/heads/builds/apk
