name: CI — سينما جماعية

on:
  push:
    branches: [main, master, arena/**]
  pull_request:

jobs:
  analyze-and-test:
    name: فحص الكود واختبارات الوحدات
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: تنصيب Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: flutter pub get
        run: flutter pub get

      - name: فحص الصياغة (analyze)
        run: flutter analyze

      - name: الاختبارات
        run: flutter test
